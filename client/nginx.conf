# Serves the React build and forwards /api to the API container.
# NOTE: nginx drops server-level add_header lines in any location that has its own
# add_header, so the security headers live in an include used by every location.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/csv;
  client_max_body_size 1m;   # the API takes JSON only; images go straight to S3

  # API on the same domain
  location /api/ {
    include /etc/nginx/security-headers.inc;
    proxy_pass http://api:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;   # repo import / daily checks can take a while
  }

  # Hashed build files can be cached for a year
  location /assets/ {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Single-page app: every other path (/p/slug, /u/handle…) is index.html
  location / {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
