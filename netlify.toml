# Netlify: builds the React client from client/. API lives on Render.
# Link previews (WhatsApp/LinkedIn…): client/netlify/edge-functions/link-preview.js reads
# VITE_API_URL (or API_URL) — make sure that variable is available to Functions, not only Builds.
[build]
  base = "client"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Set VITE_API_URL and VITE_COLLEGE_DOMAIN in Netlify > Site configuration > Environment variables

# Single-page app: every path (/p/slug, /u/handle…) serves index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
